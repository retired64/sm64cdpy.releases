name: Build & Release — Sm64CDPY

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:          # Lanzamiento manual desde la UI de GitHub Actions
    inputs:
      prerelease:
        description: '¿Marcar como pre-release? (para pruebas)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ─── Permisos ─────────────────────────────────────────────────────────────────
permissions:
  contents: write   # Necesario para crear GitHub Releases y subir assets

# ─── Job principal ────────────────────────────────────────────────────────────
jobs:
  build-and-release:
    name: Build APKs y publicar release
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Historial completo (necesario para tags)

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true          # Cachea el SDK para builds más rápidos

      # ── 4. Extraer versión desde pubspec.yaml ─────────────────────────────
      - name: Extraer versión de pubspec.yaml
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$RAW" | cut -d'+' -f1)       # "1.3.0"
          VERSION_CODE=$(echo "$RAW" | cut -d'+' -f2)  # "5"

          echo "version=$VERSION"           >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "──────────────────────────────────"
          echo "  versionName : $VERSION"
          echo "  versionCode : $VERSION_CODE"
          echo "──────────────────────────────────"

      # El manifiesto es una compuerta de release: no hay fallback genérico.
      - name: Validar manifiesto y preparar notas localizadas
        run: |
          V="${{ steps.version.outputs.version }}"
          MANIFEST="release-manifests/v${V}.json"
          python3 scripts/release_manifest.py "$MANIFEST" \
            --pubspec pubspec.yaml \
            --github-output /tmp/release_notes.txt \
            --discord-output /tmp/discord_notes.txt

          echo "── Notas verificadas para GitHub ────────────"
          cat /tmp/release_notes.txt
          echo "─────────────────────────────────────────────"

      # Un release estable debe poder avisar al repositorio web. Se comprueba
      # antes de compilar/publicar para evitar una release parcialmente
      # automatizada por un secreto ausente o sin permisos.
      - name: Verificar acceso al repositorio web
        if: inputs.prerelease == 'false'
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          WEBSITE_REPOSITORY: retired64/sm64cdpy.website
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "::error::Falta el secreto WEBSITE_DISPATCH_TOKEN."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${WEBSITE_REPOSITORY}" > /tmp/website-repository.json

          if [ "$(jq -r '.permissions.push // false' /tmp/website-repository.json)" != "true" ]; then
            echo "::error::WEBSITE_DISPATCH_TOKEN no tiene permiso de escritura en ${WEBSITE_REPOSITORY}."
            exit 1
          fi

      # ── 5. Verificar que el tag no exista ya ─────────────────────────────
      - name: Verificar que el tag v${{ steps.version.outputs.version }} no existe
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: El tag $TAG ya existe en el repositorio."
            echo "   Incrementa versionName y versionCode en pubspec.yaml antes de publicar otra release."
            exit 1
          fi
          echo "Tag $TAG disponible"

      # ── 6. Keystore ───────────────────────────────────────────────────────
      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Crear key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      # ── 7. Dependencias ──────────────────────────────────────────────────
      - name: Instalar dependencias
        run: flutter pub get

      # ── 8. Análisis estático ─────────────────────────────────────────────
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: false

      - name: flutter test
        run: flutter test

      - name: Probar contrato de manifiestos
        run: python3 -m unittest discover -s test/scripts -p '*_test.py' -v

      # ── 9. Build APKs split por ABI ─────────────────────────────────────
      - name: Build APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi

      # ── 10. Verificar que los 3 APKs se generaron ────────────────────────
      - name: Verificar APKs generados
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          MISSING=0
          for APK in \
            "app-arm64-v8a-release.apk" \
            "app-armeabi-v7a-release.apk" \
            "app-x86_64-release.apk"
          do
            if [ ! -f "$APK_DIR/$APK" ]; then
              echo "No encontrado: $APK"
              MISSING=$((MISSING+1))
            else
              SIZE=$(du -h "$APK_DIR/$APK" | cut -f1)
              echo "$APK ($SIZE)"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi

      # ── 11. Backup de APKs como artifact ─────────────────────────────────
      # Permite descargar los APKs desde la UI de Actions aunque el release falle
      - name: Backup APKs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-v${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

      # ── 12. Renombrar APKs al contrato canónico ──────────────────────────
      # El tag define la versión. Los nombres fijos permiten que GitHub sirva
      # /releases/latest/download/<asset> sin resolver la URL mediante API.
      - name: Renombrar APKs con sufijo de arquitectura
        id: apks
        run: |
          APK_DIR="build/app/outputs/flutter-apk"

          ARM64_NAME="Sm64CDPY-arm64.apk"
          ARM32_NAME="Sm64CDPY-arm32.apk"
          X86_NAME="Sm64CDPY-x86_64.apk"

          mv "$APK_DIR/app-arm64-v8a-release.apk"   "$APK_DIR/$ARM64_NAME"
          mv "$APK_DIR/app-armeabi-v7a-release.apk"  "$APK_DIR/$ARM32_NAME"
          mv "$APK_DIR/app-x86_64-release.apk"       "$APK_DIR/$X86_NAME"

          echo "──────────────────────────────────────────"
          echo "  arm64  → $ARM64_NAME"
          echo "  arm32  → $ARM32_NAME"
          echo "  x86_64 → $X86_NAME"
          echo "──────────────────────────────────────────"

          echo "arm64=$APK_DIR/$ARM64_NAME"   >> $GITHUB_OUTPUT
          echo "arm32=$APK_DIR/$ARM32_NAME"   >> $GITHUB_OUTPUT
          echo "x86_64=$APK_DIR/$X86_NAME"    >> $GITHUB_OUTPUT

      # ── 13. Completar notas validadas con las variantes APK ───────────────
      - name: Agregar guía de descargas a las notas
        run: |
          NOTES_FILE="/tmp/release_notes.txt"
          cat >> "$NOTES_FILE" << 'DOWNLOADS'

          ---
          ## Descargas

          - **arm64** → dispositivos modernos 64-bit (2018+) ← recomendado
          - **arm32** → dispositivos antiguos 32-bit
          - **x86_64** → emuladores
          DOWNLOADS

      # ── 14. Calcular SHA-256 de los APKs ─────────────────────────────────
      - name: Calcular checksums SHA-256
        run: |
          V="${{ steps.version.outputs.version }}"
          APK_DIR="build/app/outputs/flutter-apk"
          NOTES_FILE="/tmp/release_notes.txt"

          {
            echo ""
            echo "---"
            echo "## Checksums SHA-256"
            echo ""
            echo '```'
          } >> "$NOTES_FILE"

          for APK in \
            "Sm64CDPY-arm64.apk" \
            "Sm64CDPY-arm32.apk" \
            "Sm64CDPY-x86_64.apk"
          do
            HASH=$(sha256sum "$APK_DIR/$APK" | awk '{print $1}')
            echo "sha256:${HASH}  $APK" >> "$NOTES_FILE"
            echo "  $APK → $HASH"
          done

          echo '```' >> "$NOTES_FILE"

      # ── 15. Publicar GitHub Release ───────────────────────────────────────
      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Sm64CDPY v${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.txt
          files: |
            ${{ steps.apks.outputs.arm64 }}
            ${{ steps.apks.outputs.arm32 }}
            ${{ steps.apks.outputs.x86_64 }}
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: ${{ inputs.prerelease == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar contrato de assets publicado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          EXPECTED=$(printf '%s\n' \
            'Sm64CDPY-arm32.apk' \
            'Sm64CDPY-arm64.apk' \
            'Sm64CDPY-x86_64.apk')
          ACTUAL=$(gh api "repos/${{ github.repository }}/releases/tags/v${V}" \
            --jq '.assets[].name | select(endswith(".apk"))' | sort)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Los assets APK publicados no cumplen el contrato canónico."
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          fi

          if [ "${{ inputs.prerelease }}" = "false" ]; then
            curl --fail --silent --show-error --location --head \
              --retry 4 --retry-delay 3 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/latest/download/Sm64CDPY-arm64.apk" \
              > /dev/null
          fi

      # ── 16. Notificar la nueva release en Discord ─────────────────────────
      # Requiere el secreto DISCORD_WEBHOOK_URL (webhook creado en el canal destino)
      - name: Notificar release en Discord
        if: success() && inputs.prerelease == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: "1192345233183211590"
        run: |
          V="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG="v${V}"

          ARM64_URL="https://github.com/${REPO}/releases/download/${TAG}/Sm64CDPY-arm64.apk"
          ARM32_URL="https://github.com/${REPO}/releases/download/${TAG}/Sm64CDPY-arm32.apk"
          X86_URL="https://github.com/${REPO}/releases/download/${TAG}/Sm64CDPY-x86_64.apk"

          CHANGELOG=$(cat /tmp/discord_notes.txt)

          # Discord hard limit: 2000 chars. Budget para changelog = 2000 - skeleton (~450 chars) - 30 de margen
          SKELETON_LEN=450
          MAX_CHANGELOG=$((1520 - SKELETON_LEN))
          if [ "${#CHANGELOG}" -gt "$MAX_CHANGELOG" ]; then
            CHANGELOG="$(printf '%s' "$CHANGELOG" | head -c "$MAX_CHANGELOG")
          … (consulta las notas completas en sm64cdpy.org)"
          fi

          # Armar mensaje con printf (sin heredoc, sin espacios de YAML)
          MESSAGE="$(printf '%s\n\n%s\n\n%s\n\n%s\n- %s\n- %s\n- %s' \
            "## Sm64CDPY Android v${V}" \
            "<@&${DISCORD_ROLE_ID}>" \
            "${CHANGELOG}" \
            "### Descargas" \
            "[arm64 → dispositivos modernos 64-bit (recomendado)](${ARM64_URL})" \
            "[arm32 → dispositivos antiguos 32-bit](${ARM32_URL})" \
            "[x86_64 → emuladores](${X86_URL})")"

          # Garantía final: cortar a 1990 caracteres máximo
          if [ "${#MESSAGE}" -gt 1990 ]; then
            MESSAGE="$(printf '%s' "$MESSAGE" | head -c 1986)…"
          fi

          echo "Largo final del mensaje: ${#MESSAGE} caracteres"

          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE" \
            '{content: $content, allowed_mentions: {parse: ["roles"]}}')

          HTTP_STATUS=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Discord respondió con status $HTTP_STATUS"
          cat /tmp/discord_response.txt

          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::warning::No se pudo enviar la notificación a Discord (status $HTTP_STATUS)"
          fi

      # El sitio genera las tres notas localizadas desde el manifiesto exacto
      # de este commit y abre un PR. Las pre-releases no cambian la web pública.
      - name: Solicitar actualización del sitio web
        if: success() && inputs.prerelease == 'false'
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          WEBSITE_REPOSITORY: retired64/sm64cdpy.website
        run: |
          V="${{ steps.version.outputs.version }}"
          VC="${{ steps.version.outputs.version_code }}"
          PAYLOAD=$(jq -n \
            --arg version "$V" \
            --arg build "$VC" \
            --arg tag "v${V}" \
            --arg release_url "https://github.com/${{ github.repository }}/releases/tag/v${V}" \
            --arg source_repository "${{ github.repository }}" \
            --arg source_sha "${{ github.sha }}" \
            --arg manifest_path "release-manifests/v${V}.json" \
            '{event_type: "app_release_published", client_payload: {
              version: $version,
              build: $build,
              tag: $tag,
              release_url: $release_url,
              source_repository: $source_repository,
              source_sha: $source_sha,
              manifest_path: $manifest_path
            }}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${WEBSITE_REPOSITORY}/dispatches" \
            -d "$PAYLOAD"

      # ── 17. Resumen en el job summary ─────────────────────────────────────
      - name: Resumen del release
        if: success()
        run: |
          V="${{ steps.version.outputs.version }}"
          VC="${{ steps.version.outputs.version_code }}"
          APK_DIR="build/app/outputs/flutter-apk"

          ARM64_SIZE=$(du -h "$APK_DIR/Sm64CDPY-arm64.apk" | cut -f1)
          ARM32_SIZE=$(du -h "$APK_DIR/Sm64CDPY-arm32.apk" | cut -f1)
          X86_SIZE=$(du -h   "$APK_DIR/Sm64CDPY-x86_64.apk" | cut -f1)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Release publicado: Sm64CDPY v${V}

          | Archivo | Arquitectura | Tamaño |
          |---|---|---|
          | Sm64CDPY-arm64.apk | arm64-v8a (recomendado) | ${ARM64_SIZE} |
          | Sm64CDPY-arm32.apk | armeabi-v7a | ${ARM32_SIZE} |
          | Sm64CDPY-x86_64.apk | x86_64 (emuladores) | ${X86_SIZE} |

          - **Tag:** \`v${V}\`
          - **versionCode:** \`${VC}\`
          - **Pre-release:** \`${{ inputs.prerelease }}\`

          https://github.com/${{ github.repository }}/releases/tag/v${V}
          EOF

      # ── 18. Limpiar keystore SIEMPRE (incluso si falla el build) ──────────
      - name: Limpiar keystore
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties
          echo "Keystore eliminado del runner"
