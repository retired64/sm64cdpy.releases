name: sm64cdpy
description: "A mod catalog for SM64 Coop DX — browse, favorite, and explore mods including DynOS packs, touch controls, and more."
version: 1.9.0+28

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.1
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  path_provider: ^2.1.0
  http: ^1.6.0
  flutter_file_downloader: ^2.1.1

  # OTA — Descarga, verificación e instalación del APK
  ota_update: ^7.0.1
  package_info_plus: ^8.1.0
  device_info_plus: ^12.4.0
  shared_preferences: ^2.5.5
  collection: ^1.18.0
  crypto: ^3.0.7

  # Floating overlay — burbuja + panel sobre el juego
  floaty_chatheads: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  generate: true

  uses-material-design: true

  assets:
    - assets/audio/manga/
    - assets/db/database_sm64coopdx.json
    - assets/db/vip.json
    - assets/db/dynos.json
    - assets/db/touch_controls.json
    - assets/db/omm.json
    - assets/db/render96.json
    - assets/icons/
    - assets/icons/menu/
    - assets/icons/player/
    - assets/player3d/
    - assets/themes/minish/
    - assets/themes/mk64/
    - assets/themes/manga/navigation/

  fonts:
    - family: TypefaceMario64
      fonts:
        - asset: fonts/TypefaceMario64.otf
          weight: 400
    - family: MinishBarlow
      fonts:
        - asset: fonts/minish/BarlowSemiCondensed-Regular.ttf
          weight: 400
        - asset: fonts/minish/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: fonts/minish/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: MinishFondamento
      fonts:
        - asset: fonts/minish/Fondamento-Regular.ttf
          weight: 400
    - family: Mk64Racing
      fonts:
        - asset: fonts/mk64/RacingSansOne-Regular.ttf
          weight: 400
