<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <style>
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { touch-action: none; }
      .mario-stage, .mario-canvas { width: 100%; height: 100%; display: block; }
      .cached-frame { width: 100%; height: 100%; display: block; object-fit: contain; }
    </style>
  </head>
  <body>
    <main id="stage" aria-live="polite"></main>
    <!-- This runs before ESM imports: a missing dependency must not leave the
         Flutter loading projection alive forever without a bridge-ready event. -->
    <script>
      (() => {
        let stopped = false;
        let timer = 0;
        const fail = detail => {
          if (stopped) return;
          clearTimeout(timer);
          try { Player3DBridge.postState(JSON.stringify({state: "error", detail})); } catch (_) {}
        };
        const arm = () => {
          clearTimeout(timer);
          timer = setTimeout(() => fail("player3d_startup_timeout"), 30000);
        };
        window.player3dStartup = {
          note(state) {
            if (state === "ready" || state === "error") clearTimeout(timer);
            else if (state === "bridge-ready" || state === "loading") arm();
          },
        };
        window.addEventListener("error", event => {
          fail(event.message || "player3d_module_load_failed");
        }, true);
        window.addEventListener("unhandledrejection", event => {
          fail(event.reason?.message || "player3d_unhandled_rejection");
        });
        window.addEventListener("pagehide", () => {
          stopped = true;
          clearTimeout(timer);
        }, {once: true});
        arm();
      })();
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
