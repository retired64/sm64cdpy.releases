<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="55%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#E68A00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="45%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E52521"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Aura pulsante detrás de la estrella -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)">
    <animate attributeName="r" values="18;24;18" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Grupo que rebota tipo power-up recolectado -->
  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-4; 0,0; 0,-1.5; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1s"
      repeatCount="indefinite"/>

    <!-- Llamitas detrás, estilo "tendencia caliente" -->
    <g opacity="0.9">
      <path d="M16 46 c-2 -6 3 -8 1 -14 c5 2 7 8 4 13 c3 -1 4 -4 4 -6 c3 4 2 10 -3 12 c-4 2 -8 0 -6 -5z" fill="url(#flameGrad)">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1.15;1,1" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M48 46 c-2 -6 3 -8 1 -14 c5 2 7 8 4 13 c3 -1 4 -4 4 -6 c3 4 2 10 -3 12 c-4 2 -8 0 -6 -5z" fill="url(#flameGrad)">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1.15;1,1" dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Estrella dorada estilo power-up, con giro sutil -->
    <g transform="translate(32,32)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="-8;8;-8"
          dur="1.6s"
          repeatCount="indefinite"/>
        <path d="M0,-18 L5.3,-6.5 L18,-5.5 L8.5,3 L11,15.5 L0,9 L-11,15.5 L-8.5,3 L-18,-5.5 L-5.3,-6.5 Z"
              fill="url(#starGrad)" stroke="#A85E00" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- ojos simples tipo carita amistosa -->
        <circle cx="-5" cy="-2" r="2" fill="#3B2415"/>
        <circle cx="5" cy="-2" r="2" fill="#3B2415"/>
        <path d="M-4 5 Q0 8 4 5" stroke="#3B2415" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Destellos alrededor -->
    <g fill="#FFFFFF">
      <polygon points="52,14 52.7,16 54.7,16.7 52.7,17.4 52,19.4 51.3,17.4 49.3,16.7 51.3,16" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="12,20 12.7,22 14.7,22.7 12.7,23.4 12,25.4 11.3,23.4 9.3,22.7 11.3,22" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="32,50 32.7,52 34.7,52.7 32.7,53.4 32,55.4 31.3,53.4 29.3,52.7 31.3,52" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
