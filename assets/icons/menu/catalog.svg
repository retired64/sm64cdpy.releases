<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE9B3"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#E68A00"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grupo que rebota como cuando Mario recoge algo -->
  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-4; 0,0; 0,-1.5; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1.1s"
      repeatCount="indefinite"/>

    <!-- Libro / catálogo -->
    <g>
      <!-- lomo rojo estilo ladrillo Mario -->
      <path d="M14 14 h10 v36 h-10 a4 4 0 0 1 -4 -4 v-28 a4 4 0 0 1 4 -4 z" fill="#E52521"/>
      <rect x="12" y="18" width="12" height="4" fill="#B71C1C" opacity="0.5"/>
      <rect x="12" y="26" width="12" height="4" fill="#B71C1C" opacity="0.5"/>
      <rect x="12" y="34" width="12" height="4" fill="#B71C1C" opacity="0.5"/>
      <rect x="12" y="42" width="12" height="4" fill="#B71C1C" opacity="0.5"/>

      <!-- páginas -->
      <path d="M24 14 h24 a2 2 0 0 1 2 2 v32 a2 2 0 0 1 -2 2 h-24 z" fill="url(#pageGrad)" stroke="#D8B26B" stroke-width="1.5"/>

      <!-- líneas de texto -->
      <rect x="29" y="21" width="16" height="2" rx="1" fill="#C9A15A"/>
      <rect x="29" y="27" width="16" height="2" rx="1" fill="#C9A15A"/>
      <rect x="29" y="33" width="12" height="2" rx="1" fill="#C9A15A"/>
      <rect x="29" y="39" width="16" height="2" rx="1" fill="#C9A15A"/>
      <rect x="29" y="45" width="10" height="2" rx="1" fill="#C9A15A"/>
    </g>

    <!-- Moneda estilo power-up flotando y girando encima del libro -->
    <g transform="translate(44,10)">
      <animateTransform
        attributeName="transform"
        type="translate"
        additive="sum"
        values="0,0; 0,-3; 0,0"
        keyTimes="0;0.5;1"
        dur="0.9s"
        repeatCount="indefinite"/>
      <g>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1,1; 0.35,1; 1,1; 0.35,1; 1,1"
          dur="0.9s"
          repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="9" fill="url(#coinGrad)" stroke="#A85E00" stroke-width="1"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#FFF4CC" stroke-width="1" opacity="0.7"/>
        <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#A85E00" text-anchor="middle">$</text>
      </g>
      <circle cx="0" cy="0" r="12" fill="url(#sparkGlow)">
        <animate attributeName="opacity" values="0;0.8;0" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Destellos tipo "estrella recogida" -->
    <g fill="#FFFFFF">
      <polygon points="52,44 53,47 56,48 53,49 52,52 51,49 48,48 51,47" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="10,6 10.7,8 12.7,8.7 10.7,9.4 10,11.4 9.3,9.4 7.3,8.7 9.3,8" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
