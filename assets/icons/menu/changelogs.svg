<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FCE7A8"/>
    </linearGradient>
    <linearGradient id="rollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A356"/>
      <stop offset="100%" stop-color="#A9702B"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B54"/>
      <stop offset="100%" stop-color="#C21B1B"/>
    </linearGradient>
    <radialGradient id="newGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF176" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grupo con rebote leve -->
  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-3; 0,0; 0,-1; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1.2s"
      repeatCount="indefinite"/>

    <!-- Rollo superior -->
    <rect x="12" y="12" width="40" height="7" rx="3.5" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>
    <circle cx="12" cy="15.5" r="4.2" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>
    <circle cx="52" cy="15.5" r="4.2" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>

    <!-- Pergamino -->
    <rect x="14" y="19" width="36" height="30" fill="url(#scrollGrad)" stroke="#D8B26B" stroke-width="1.3"/>

    <!-- Rollo inferior -->
    <rect x="12" y="45" width="40" height="7" rx="3.5" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>
    <circle cx="12" cy="48.5" r="4.2" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>
    <circle cx="52" cy="48.5" r="4.2" fill="url(#rollGrad)" stroke="#6E4718" stroke-width="1.3"/>

    <!-- Lista de cambios con checks -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 27 l2.2 2.2 L25 25" fill="none" stroke="#2E9E4F" stroke-width="2.2"/>
      <rect x="28" y="26.3" width="16" height="2.2" rx="1.1" fill="#C9A15A"/>

      <path d="M19 34.5 l2.2 2.2 L25 32.5" fill="none" stroke="#2E9E4F" stroke-width="2.2"/>
      <rect x="28" y="33.8" width="13" height="2.2" rx="1.1" fill="#C9A15A"/>

      <path d="M19 42 l2.2 2.2 L25 40" fill="none" stroke="#2E9E4F" stroke-width="2.2"/>
      <rect x="28" y="41.3" width="16" height="2.2" rx="1.1" fill="#C9A15A"/>
    </g>

    <!-- Sello rojo estilo Mario con estrella -->
    <g transform="translate(46,44)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="-6;6;-6" dur="1.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="9" fill="url(#sealGrad)" stroke="#7A0F0F" stroke-width="1.3"/>
      <path d="M0,-4.6 L1.4,-1.6 L4.6,-1.4 L2.2,0.6 L3,3.8 L0,2.1 L-3,3.8 L-2.2,0.6 L-4.6,-1.4 L-1.4,-1.6 Z" fill="#FFE066"/>
    </g>

    <!-- Aura de "nuevo" -->
    <circle cx="46" cy="44" r="14" fill="url(#newGlow)" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Destellos -->
    <g fill="#FFFFFF">
      <polygon points="16,10 16.7,12 18.7,12.7 16.7,13.4 16,15.4 15.3,13.4 13.3,12.7 15.3,12" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
