<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#E6A817"/>
      <stop offset="100%" stop-color="#8A5B00"/>
    </linearGradient>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#BFEFFF"/>
      <stop offset="45%" stop-color="#4FC3E8"/>
      <stop offset="80%" stop-color="#1E6FB8"/>
      <stop offset="100%" stop-color="#0F3E75"/>
    </radialGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-3; 0,0; 0,-1; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1.2s"
      repeatCount="indefinite"/>

    <rect x="10" y="10" width="44" height="44" rx="4" fill="url(#frameGrad)" stroke="#5C3B00" stroke-width="2"/>
    <rect x="15" y="15" width="34" height="34" rx="2" fill="#5C3B00"/>

    <clipPath id="portalClip">
      <rect x="16.5" y="16.5" width="31" height="31" rx="1.5"/>
    </clipPath>
    <g clip-path="url(#portalClip)">
      <circle cx="32" cy="32" r="20" fill="url(#portalGrad)"/>
      <g stroke="#FFFFFF" stroke-opacity="0.35" fill="none" stroke-width="1.4">
        <circle cx="32" cy="32" r="6">
          <animate attributeName="r" values="4;16;4" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="32" r="6">
          <animate attributeName="r" values="4;16;4" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g fill="#FFE066">
        <g transform="translate(32,32)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite" additive="sum"/>
          <polygon points="0,-14 1.6,-11 4.8,-10.7 2.4,-8.6 3.2,-5.5 0,-7.2 -3.2,-5.5 -2.4,-8.6 -4.8,-10.7 -1.6,-11"/>
        </g>
        <g transform="translate(32,32) rotate(150)">
          <animateTransform attributeName="transform" type="rotate" from="150" to="510" dur="3.5s" repeatCount="indefinite" additive="sum"/>
          <polygon points="0,-9 1,-7 3,-6.8 1.5,-5.4 2,-3.5 0,-4.5 -2,-3.5 -1.5,-5.4 -3,-6.8 -1,-7"/>
        </g>
      </g>
    </g>

    <circle cx="32" cy="32" r="24" fill="url(#portalGlow)" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="14" cy="14" r="1.8" fill="#5C3B00"/>
    <circle cx="50" cy="14" r="1.8" fill="#5C3B00"/>
    <circle cx="14" cy="50" r="1.8" fill="#5C3B00"/>
    <circle cx="50" cy="50" r="1.8" fill="#5C3B00"/>

    <g fill="#FFFFFF">
      <polygon points="10,52 10.7,54 12.7,54.7 10.7,55.4 10,57.4 9.3,55.4 7.3,54.7 9.3,54" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="54,10 54.7,12 56.7,12.7 54.7,13.4 54,15.4 53.3,13.4 51.3,12.7 53.3,12" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
