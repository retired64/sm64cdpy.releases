<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B8A3A"/>
      <stop offset="45%" stop-color="#3DCB5F"/>
      <stop offset="60%" stop-color="#2FAE4E"/>
      <stop offset="100%" stop-color="#146B2C"/>
    </linearGradient>
    <linearGradient id="pipeTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26A648"/>
      <stop offset="45%" stop-color="#4FE076"/>
      <stop offset="60%" stop-color="#33BB58"/>
      <stop offset="100%" stop-color="#1B8A3A"/>
    </linearGradient>
    <radialGradient id="warpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9FFEA" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#4FD8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FD8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grupo que rebota suave -->
  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-3; 0,0; 0,-1; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1.2s"
      repeatCount="indefinite"/>

    <!-- Brillo del portal saliendo del tubo -->
    <ellipse cx="32" cy="24" rx="12" ry="6" fill="url(#warpGlow)">
      <animate attributeName="ry" values="4;7;4" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Cuerpo del tubo -->
    <rect x="18" y="24" width="28" height="28" rx="2" fill="url(#pipeGrad)" stroke="#0F5C22" stroke-width="1.5"/>
    <!-- brillo vertical del cuerpo -->
    <rect x="23" y="26" width="4" height="24" fill="#7CEB9A" opacity="0.5" rx="2"/>

    <!-- Boca / reborde del tubo -->
    <rect x="14" y="16" width="36" height="12" rx="3" fill="url(#pipeTopGrad)" stroke="#0F5C22" stroke-width="1.5"/>
    <ellipse cx="32" cy="22" rx="14" ry="4.5" fill="#0F5C22" opacity="0.85"/>
    <ellipse cx="32" cy="21" rx="11" ry="3.2" fill="#0A3D17"/>

    <!-- Eslabones de cadena "link" saliendo del tubo, estilo item -->
    <g stroke="#FFC400" stroke-width="3.4" fill="none" stroke-linecap="round">
      <ellipse cx="32" cy="7" rx="5" ry="4" transform="rotate(20 32 7)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="38" cy="10" rx="5" ry="4" transform="rotate(-20 38 10)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Destellos tipo warp -->
    <g fill="#FFFFFF">
      <polygon points="46,14 46.7,16 48.7,16.7 46.7,17.4 46,19.4 45.3,17.4 43.3,16.7 45.3,16" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="18,10 18.7,12 20.7,12.7 18.7,13.4 18,15.4 17.3,13.4 15.3,12.7 17.3,12" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.6s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
