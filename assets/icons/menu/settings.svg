<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FA8FF"/>
      <stop offset="55%" stop-color="#2E6DE0"/>
      <stop offset="100%" stop-color="#1A3F99"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E68A00"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grupo con leve rebote general -->
  <g id="bounceGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-2.5; 0,0; 0,-1; 0,0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="1.3s"
      repeatCount="indefinite"/>

    <!-- Engranaje azul giratorio -->
    <g transform="translate(32,34)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="4s"
          repeatCount="indefinite"/>

        <!-- dientes del engranaje -->
        <g fill="url(#gearGrad)" stroke="#122B6B" stroke-width="1.3">
          <rect x="-3.2" y="-19" width="6.4" height="8" rx="1.5"/>
          <rect x="-3.2" y="11" width="6.4" height="8" rx="1.5"/>
          <rect x="-19" y="-3.2" width="8" height="6.4" rx="1.5"/>
          <rect x="11" y="-3.2" width="8" height="6.4" rx="1.5"/>
          <rect x="-3.2" y="-19" width="6.4" height="8" rx="1.5" transform="rotate(45)"/>
          <rect x="-3.2" y="11" width="6.4" height="8" rx="1.5" transform="rotate(45)"/>
          <rect x="-19" y="-3.2" width="8" height="6.4" rx="1.5" transform="rotate(45)"/>
          <rect x="11" y="-3.2" width="8" height="6.4" rx="1.5" transform="rotate(45)"/>
        </g>

        <!-- cuerpo circular -->
        <circle cx="0" cy="0" r="14" fill="url(#gearGrad)" stroke="#122B6B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="9" fill="#EAF3FF" stroke="#122B6B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="5.5" fill="#2E6DE0"/>
        <circle cx="-2" cy="-2" r="1.8" fill="#9CC4FF" opacity="0.8"/>
      </g>

      <!-- destello suave en el centro -->
      <circle cx="0" cy="0" r="16" fill="url(#hubGlow)" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Llave inglesa estilo herramienta, apoyada en diagonal -->
    <g transform="translate(46,44) rotate(35)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0;-8;0" dur="1.3s" repeatCount="indefinite"/>
      <rect x="-2.6" y="-16" width="5.2" height="24" rx="2.6" fill="url(#wrenchGrad)" stroke="#8A5200" stroke-width="1.2"/>
      <path d="M-6 -20 a6 6 0 1 0 12 0 a6 6 0 0 0 -3 5.2 a2.2 2.2 0 0 1 -6 0 a6 6 0 0 0 -3 -5.2 z"
            fill="url(#wrenchGrad)" stroke="#8A5200" stroke-width="1.2"/>
      <rect x="-3.4" y="6" width="6.8" height="4" rx="1.5" fill="url(#wrenchGrad)" stroke="#8A5200" stroke-width="1.2"/>
    </g>

    <!-- Destellos -->
    <g fill="#FFFFFF">
      <polygon points="12,14 12.7,16 14.7,16.7 12.7,17.4 12,19.4 11.3,17.4 9.3,16.7 11.3,16" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="52,52 52.7,54 54.7,54.7 52.7,55.4 52,57.4 51.3,55.4 49.3,54.7 51.3,54" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
